openapi: 3.1.0
info:
  title: Cluster Viral Engine render API
  version: 0.6.0
  description: Implementado y probado en local. El render corre en un worker aparte, nunca dentro de una petición HTTP. Almacenamiento real y worker facturado siguen BLOCKED_EXTERNAL. Todas las rutas exigen sesión. Aquí se aprueba un render por el hash de sus bytes, pero no se publica nada; publicar sigue bloqueado hasta verificar Meta.
servers:
  - url: /api/organizations/{organizationId}
    variables:
      organizationId: { default: '00000000-0000-0000-0000-000000000000' }
paths:
  /projects/{projectId}/renders:
    get: { summary: 'Listar renders con estado, intentos, QA y métricas; limit 1-100', responses: { '200': { description: Renders }, '400': { description: limit inválido } } }
    post:
      summary: 'Pedir un render del material vigente (project:write). Idempotente por hash del manifest: lo igual devuelve el mismo render y lo fallido o cancelado se reencola. Cancela lo que siga activo con material anterior'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenderRequest' } } } }
      responses:
        '202': { description: 'Aceptado en cola, o ya existente: id, status, manifest_sha256 y created' }
        '400': { description: 'INVALID_INPUT: campo desconocido (por ejemplo approved) o título inexistente' }
        '403': { description: FORBIDDEN }
        '404': { description: Proyecto de otra organización o inexistente }
        '409': { description: 'CONFLICT sin guion aprobado o fuera de etapa; BLOCKED_BY_POLICY con bloqueos de medios o tope de gasto' }
  /projects/{projectId}/renders/{renderId}:
    get: { summary: 'Leer un render con su manifest, QA, métricas y estado del job', responses: { '200': { description: Render }, '404': { description: NOT_FOUND } } }
  /projects/{projectId}/renders/{renderId}/cancel:
    post:
      summary: 'Cancelar (project:write). En cola se cancela al momento; en ejecución el worker detiene el proceso y limpia (CANCELLING). Cuerpo vacío {}'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '202': { description: 'id y status CANCELLED o CANCELLING' }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT si ya terminó } }
  /projects/{projectId}/renders/{renderId}/urls:
    get: { summary: 'URL firmadas de 5 minutos para master, preview, póster y SRT', responses: { '200': { description: URL y caducidad }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT si no terminó con éxito } } }
  /projects/{projectId}/renders/{renderId}/review:
    get: { summary: 'Paquete de revisión: render, URL firmadas, bloqueos, avisos, comprobaciones humanas pendientes, claims y fuentes citados, derechos, coste por proveedor y decisiones anteriores', responses: { '200': { description: 'Paquete; approved dice si es la aprobación vigente' }, '404': { description: NOT_FOUND }, '409': { description: 'CONFLICT si el proyecto no está en VIDEO_REVIEW o APPROVED, o el render no terminó con éxito' } } }
  /projects/{projectId}/renders/{renderId}/decision:
    post:
      summary: 'Aprobar o rechazar los bytes exactos (editorial:review). Relee licencias, claims, QA y material vigente en la transacción. No publica nada. Una aprobación vigente se retira con REJECTED y no se repite'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenderDecision' } } } }
      responses:
        '200': { description: 'id, decision, target_sha256, decided_by, decided_at y project_status' }
        '400': { description: 'INVALID_INPUT: campo desconocido (por ejemplo approved), hash mal formado o rechazo sin nota' }
        '403': { description: FORBIDDEN para quien no tiene editorial:review }
        '404': { description: Render de otra organización o inexistente }
        '409': { description: 'CONFLICT si el hash no es el de los bytes o la etapa no lo permite; BLOCKED_BY_POLICY con bloqueos de derechos, claims, QA, material cambiado o render del doble de pruebas' }
components:
  schemas:
    RenderDecision:
      type: object
      additionalProperties: false
      required: [decision, target_sha256]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        target_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'artifact_sha256 del render, no el hash del manifest' }
        note: { type: string, maxLength: 1000, description: 'Obligatoria al rechazar, mínimo 3 caracteres' }
    RenderRequest:
      type: object
      additionalProperties: false
      properties:
        title_index: { type: [integer, 'null'], minimum: 0, maximum: 9, description: 'Índice de title_options del guion aprobado para el título en pantalla; null sin título. Forma parte del manifest' }
