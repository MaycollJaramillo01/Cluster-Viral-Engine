name: quality-gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate package and backlog
        run: python3 scripts/validate_package.py
      - name: Scan source without logging secrets
        run: python3 scripts/scan_secrets.py
      - name: Check Unix launcher syntax
        run: bash -n scripts/start-local.sh
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-fund
      # Las pruebas de render corren contra FFmpeg real; sin este paso se omitirían sin avisar.
      - name: Install FFmpeg and subtitle fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation
      - name: Unit and contract tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify server credentials stay out of browser bundles
        run: npm run verify:client
      # eslint's minimatch 3 advisory (moderate, dev-only) has no non-breaking fix upstream; see docs/phase01/EVIDENCIA.md.
      - name: Dependency audit (runtime moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Dependency audit (all high+)
        run: npm audit --audit-level=high
  phase00-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase00_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --no-fund
      # Las pruebas de render corren contra FFmpeg real; sin este paso se omitirían sin avisar.
      - name: Install FFmpeg and subtitle fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation
      - name: Real PostgreSQL isolation, concurrency and rollback tests
        env:
          PHASE00_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/phase00_ci
          PHASE01_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:db
# Production promotion is manual; no database migration or deployment runs with PR credentials.
